[versions]
ktx = "1.16.0"
activity-compose = "1.10.1"
compose-bom = "2026.02.00"
coil = "2.7.0"
retrofit = "2.11.0"
converter-gson = "2.11.0"
lifecycle = "2.8.7"
navigation-compose = "2.8.9"
room = "2.7.0"
okhttp = "4.12.0"
gson = "2.11.0"
junit = "4.13.2"
mockito = "5.14.2"
arch-core-testing = "2.2.0"
coroutines-test = "1.9.0"
turbine = "1.2.0"
junit-ext = "1.2.1"
espresso-core = "3.6.1"

android-Gradle-Plugin = "9.1.0"
kotlin-android = "2.1.10"

[libraries]
androidxktx = { group = "androidx.core", name = "core-ktx", version.ref = "ktx" }
androidxactivity = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
composebom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
composeui = { group = "androidx.compose.ui", name = "ui" }
composeuigraphics = { group = "androidx.compose.ui", name = "ui-graphics" }
composetoolingpreview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
composematerial3 = { group = "androidx.compose.material3", name = "material3" }
materialiconsextended = { group = "androidx.compose.material", name = "material-icons-extended" }
coilcompose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
convertergson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "converter-gson" }
lifecycleviewmodelcompose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
navigationcompose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }
lifecycleruntimecompose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
roomruntime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
roomktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
roomcompiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
okhttplogging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
mockito = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
archcoretesting = { group = "androidx.arch.core", name = "core-testing", version.ref = "arch-core-testing" }
coroutinestest = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines-test" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
junitext = { group = "androidx.test.ext", name = "junit", version.ref = "junit-ext" }
espressocore = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso-core" }
uitestjunit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
uitooling = { group = "androidx.compose.ui", name = "ui-tooling" }
uitestmanifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

[plugins]
androidapplication = { id = "com.android.application", version.ref = "android-Gradle-Plugin" }
# AGP 9+ provides built-in Kotlin; do not apply org.jetbrains.kotlin.android (see migrate-to-built-in-kotlin).
legacykapt = { id = "com.android.legacy-kapt", version.ref = "android-Gradle-Plugin" }
kotlincompose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin-android" }
